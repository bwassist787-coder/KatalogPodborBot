name: Render weekday health check

on:
  schedule:
    # Every 10 minutes 09:00–18:50, and once at 19:00 Moscow time.
    - cron: '*/10 9-18 * * 1-5'
      timezone: 'Europe/Moscow'
    - cron: '0 19 * * 1-5'
      timezone: 'Europe/Moscow'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-healthcheck
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration and request /healthz
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_BASE_URL" || -z "$HEALTHCHECK_TOKEN" ]]; then
            echo "Missing RENDER_BASE_URL or HEALTHCHECK_TOKEN secret."
            exit 1
          fi
          case "$RENDER_BASE_URL" in
            https://*.onrender.com|https://*.onrender.com/) ;;
            *) echo "Invalid Render HTTPS origin."; exit 1 ;;
          esac
          URL="${RENDER_BASE_URL%/}/healthz"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 \
            --max-time 90 \
            --header "X-Health-Token: $HEALTHCHECK_TOKEN" \
            --header 'Cache-Control: no-cache' \
            --output /dev/null "$URL"
          echo "Authenticated Render health check succeeded."
